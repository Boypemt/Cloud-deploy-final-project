apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: campusmart
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          # Replace <dockerhub-user> and pin the released version tag
          image: docker.io/<dockerhub-user>/campusmart-order-service:1.0.0
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: campusmart-secrets, key: ORDER_MONGO_URI } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: campusmart-secrets, key: JWT_SECRET } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: campusmart-secrets, key: INTERNAL_API_KEY } }
            - name: PRODUCT_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: campusmart-config, key: PRODUCT_SERVICE_URL } }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: campusmart
spec:
  type: ClusterIP
  selector: { app: order-service }
  ports:
    - port: 3003
      targetPort: 3003
