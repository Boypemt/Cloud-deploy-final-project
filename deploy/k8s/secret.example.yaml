# Copy to secret.yaml, fill in real values, then: kubectl apply -f secret.yaml
# secret.yaml is git-ignored — NEVER commit real secrets.
# For the class demo on Docker Desktop you can point the URIs at mongo-dev (02-mongo-dev.yaml);
# for a real deployment use your MongoDB Atlas connection strings.
apiVersion: v1
kind: Secret
metadata:
  name: campusmart-secrets
  namespace: campusmart
type: Opaque
stringData:
  JWT_SECRET: change-me-to-a-long-random-string
  INTERNAL_API_KEY: change-me-too
  AUTH_MONGO_URI: mongodb://mongo-dev:27017/campusmart_auth
  PRODUCT_MONGO_URI: mongodb://mongo-dev:27017/campusmart_products
  ORDER_MONGO_URI: mongodb://mongo-dev:27017/campusmart_orders
