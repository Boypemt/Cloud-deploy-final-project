apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: campusmart
spec:
  replicas: 2
  selector:
    matchLabels: { app: web-frontend }
  template:
    metadata:
      labels: { app: web-frontend }
    spec:
      containers:
        - name: web-frontend
          image: docker.io/<dockerhub-user>/campusmart-web-frontend:1.0.0
          ports:
            - containerPort: 80
          # Upstream URLs default to the K8s Service names above (set in the Dockerfile)
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
# LoadBalancer = entry point from outside. On Docker Desktop Kubernetes it is reachable at http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: campusmart
spec:
  type: LoadBalancer
  selector: { app: web-frontend }
  ports:
    - port: 8080
      targetPort: 80
