# CI for web-frontend (owner: Bonus)
# install -> type-check & build (Vite) -> unit tests (Vitest) -> docker build check
name: CI - web-frontend

on:
  push:
    paths:
      - 'web-frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'web-frontend/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: web-frontend

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Unit tests
        run: npm test

  docker:
    name: Docker image builds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push — pushing happens in release.yml)
        uses: docker/build-push-action@v6
        with:
          context: web-frontend
          push: false
          tags: campusmart-web-frontend:ci
