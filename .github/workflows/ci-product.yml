# CI for product-service (owner: Por)
# Runs on every push / pull request that touches product-service/ :
#   install -> build (tsc) -> unit tests -> integration tests (real MongoDB) -> docker build check
name: CI - product-service

on:
  push:
    paths:
      - 'product-service/**'
      - '.github/workflows/ci-product.yml'
  pull_request:
    paths:
      - 'product-service/**'
      - '.github/workflows/ci-product.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: product-service

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # wait until MongoDB really accepts connections before the steps start
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/product_test
      JWT_SECRET: ci-test-secret
      INTERNAL_API_KEY: ci-internal-key
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript -> dist)
        run: npm run build

      - name: Unit tests
        run: npm run test:coverage

      - name: Integration tests
        run: npm run test:int

  docker:
    name: Docker image builds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push — pushing happens in release.yml)
        uses: docker/build-push-action@v6
        with:
          context: product-service
          push: false
          tags: campusmart-product-service:ci
