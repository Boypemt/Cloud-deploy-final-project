# CI for order-service (owner: Fluke)
# Runs on every push / pull request that touches order-service/ :
#   install -> build (tsc) -> unit tests -> integration tests (real MongoDB) -> docker build check
name: CI - order-service

on:
  push:
    paths:
      - 'order-service/**'
      - '.github/workflows/ci-order.yml'
  pull_request:
    paths:
      - 'order-service/**'
      - '.github/workflows/ci-order.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: order-service

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI_TEST: mongodb://localhost:27017/order_test
      JWT_SECRET: ci-test-secret
      INTERNAL_API_KEY: ci-internal-key
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: order-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript -> dist)
        run: npm run build

      - name: Unit tests
        run: npm run test:coverage

      - name: Integration tests
        run: npm run test:int

  docker:
    name: Docker image builds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push — pushing happens in release.yml)
        uses: docker/build-push-action@v6
        with:
          context: order-service
          push: false
          tags: campusmart-order-service:ci
