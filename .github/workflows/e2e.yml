# System / integration / E2E tests with Robot Framework (owner: Pound)
# Starts the WHOLE stack with docker compose (all 5 services + MongoDB), then runs the
# Robot suite against the gateway, like a real user would. Reports are uploaded as artifacts.
name: E2E - Robot Framework

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Only run tests with this tag (e.g. Smoke). Empty = all ready tests.'
        required: false
        default: ''

jobs:
  e2e:
    name: System tests on docker compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start the stack (build + wait until every container is healthy)
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Show running containers
        run: docker compose ps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: qa-automation/requirements.txt

      - name: Install Robot Framework
        run: pip install -r qa-automation/requirements.txt

      - name: Run Robot Framework tests
        working-directory: qa-automation
        env:
          BASE_URL: http://localhost:8080
          HEADLESS: 'True'
        run: |
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            robot --outputdir results --exclude wip --include "${{ github.event.inputs.tags }}" tests
          else
            robot --outputdir results --exclude wip tests
          fi

      - name: Save container logs
        if: always()
        run: docker compose logs --no-color > qa-automation/results/docker-compose.log

      - name: Upload Robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: qa-automation/results/

      - name: Stop the stack
        if: always()
        run: docker compose down -v
